<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel</title>
<meta name="description" content="Private food and weight log">
<meta name="theme-color" content="#0E0F11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<style>
:root{
  --bg:#0E0F11; --card:#17191C; --card2:#1D2024; --chip:#24272C; --line:#2A2E33;
  --ink:#F4F5F6; --ink2:#A3AAB3; --ink3:#737B85;
  --acc:#5AA9FF; --onacc:#0E0F11; --warn:#FF9F43; --bad:#FF6B6B; --good:#5FD38D;
  --p:#FF7A70; --f:#FFC94D; --c:#5FD38D;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:12px;padding:12px 14px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.scroll{flex:1;padding:calc(env(safe-area-inset-top) + 16px) 16px 190px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top h1{margin:0;flex:1;font-size:30px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink2);flex:none}
.ib:active{background:var(--line)}

.week{display:grid;grid-template-columns:24px repeat(7,1fr) 24px;gap:4px;align-items:center;margin-bottom:14px}
.wk-arrow{color:var(--ink3);height:56px;display:grid;place-items:center}
.wk-arrow svg{width:18px;height:18px}
.d{padding:7px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:16px;font-weight:700}
.d small{font-size:11px;font-weight:600;color:var(--ink2)}
.d i{display:block;height:3px;border-radius:2px;margin-top:4px;width:60%;background:var(--line);overflow:hidden}
.d i b{display:block;height:100%;background:var(--acc)}
.d.today{color:var(--acc)}
.d.on{background:var(--acc);color:var(--onacc)}
.d.on small{color:var(--onacc)}
.d.on i{background:rgba(0,0,0,.25)}.d.on i b{background:var(--onacc)}

.left{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px;padding:14px;border-radius:16px;background:var(--card);width:100%;text-align:left}
.lv b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.lv b.over{color:var(--bad)}
.lv span{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-top:1px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%}
.micro{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 14px 0;font-size:13px;color:var(--ink2)}
.micro b{color:var(--ink);font-weight:600}
.coach{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--card);font-size:14px;color:var(--ink2);display:flex;gap:10px;align-items:flex-start}
.coach b{color:var(--ink)}

.tl{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.hour{display:flex;align-items:center;gap:8px;min-height:34px}
.hp{font-size:14px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--chip);min-width:66px;text-align:center}
.hp.has{background:var(--acc);color:var(--onacc)}
.add{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--acc)}
.add svg{width:18px;height:18px}
.tot{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2);padding:6px 0 6px 8px;text-align:right}
.tot b{color:var(--ink);font-weight:700}
.food{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);width:100%;text-align:left}
.food:active{background:var(--card2)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--chip);line-height:1}
.fi{flex:1;min-width:0;display:block}
.fi .nm,.fi .row-sub,.fi .tag{display:block}
.nm{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.mx{margin-top:3px;font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:0 10px}
.mx .k{color:var(--ink);font-weight:700}
.mx .m::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px;background:var(--dc)}
.mx .P{--dc:var(--p)}.mx .F{--dc:var(--f)}.mx .C{--dc:var(--c)}
.ed{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);background:var(--chip)}
.ed svg{width:16px;height:16px}
.food.sug{background:transparent;border:1.5px dashed var(--line)}
.food.sug .nm{color:var(--ink2)}
.food.sug .ed{background:var(--acc);color:var(--onacc)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.02em;margin-bottom:2px}
.now{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--p);margin:2px 0}
.now::after{content:"";flex:1;height:2px;background:var(--p);opacity:.6;border-radius:2px}
.empty{color:var(--ink3);font-size:14px;padding:4px 0 0}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--chip);padding:10px 16px calc(8px + env(safe-area-inset-bottom))}
.dock-in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.srch{display:flex;gap:8px}
.sb{flex:1;height:48px;border-radius:99px;background:var(--chip);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;font-size:16px;color:var(--ink2);text-align:left}
.sb .grow{flex:1}
.sb .bc{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.qa{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--acc);flex:none}
.nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:11px;font-weight:600;color:var(--ink3)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.nav .cur{color:var(--ink)}
.plus{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;margin:0 auto}
.plus svg{width:26px;height:26px;stroke-width:2.6}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.backdrop{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.55)}
.sheet.half{top:auto;max-height:80vh;border-radius:22px 22px 0 0;background:var(--card);box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.sheet.half .sh-top{padding-top:12px}
.sheet.half .sh-body{flex:none}
.sheet.half .menu-item{background:var(--card2)}
.sheet.half .sc span{background:var(--card2)}
.sh-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;max-width:560px;width:100%;margin:0 auto}
.sh-top h2{margin:0;flex:1;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{flex:1;overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;display:flex;gap:10px}
.btn{height:50px;border-radius:14px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:16px;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--chip);color:var(--bad)}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 14px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:8px}
.row-sub{font-size:13px;color:var(--ink3);margin-top:1px;overflow-wrap:anywhere}
.sec-h{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nbig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border-radius:16px;padding:14px;margin:4px 0 14px}
.nbig div{text-align:center}
.nbig b{display:block;font-size:22px;font-weight:800}
.nbig span{font-size:12px;color:var(--ink2);font-weight:600}
.ntable{background:var(--card);border-radius:16px;padding:4px 14px;margin-bottom:14px}
.ntable div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.ntable div:last-child{border-bottom:0}
.ntable span{color:var(--ink2)}
.warnbox{background:rgba(255,107,107,.12);color:#FFB3B3;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.note{font-size:13px;color:var(--ink3);line-height:1.45}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700;color:var(--ink2)}
.bignum{font-size:34px;font-weight:800;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink2)}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);width:100%;text-align:left;font-size:16px;font-weight:600}
.menu-item small{display:block;font-weight:400;font-size:13px;color:var(--ink3)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:24px;height:42px;border-radius:10px;background:var(--chip)}
.emojis button.on{outline:2px solid var(--acc)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.star.on{color:var(--f)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
#scan{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .frame{position:absolute;left:12%;right:12%;top:32%;height:22%;border:3px solid var(--acc);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
#scan .bar2{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;background:#000}
#scan .msg{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;text-align:center;font-weight:600;text-shadow:0 1px 4px #000}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast button{color:#1463FF;font-weight:800}
svg.chart{width:100%;height:auto;display:block}
.sug-h{display:flex;justify-content:space-between;align-items:baseline}
.link{color:var(--acc);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0}
.qwrap{display:flex;gap:8px;align-items:center;background:var(--chip);border-radius:99px;padding:0 4px 0 14px;margin-bottom:8px}
.qwrap input{background:none;border:0;padding:12px 4px;font-size:17px}
.qwrap input:focus{border:0}
.qwrap .qi{color:var(--ink3);display:grid}
.qwrap .ib{width:40px;height:40px;background:none;color:var(--ink)}
.tchip{width:auto!important;padding:8px 10px!important;border-radius:99px!important;font-weight:700;font-size:14px}
.kchip{font-weight:700}.kchip.over{color:var(--bad)}
.srow{padding:0;gap:0}
.srow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 4px 12px 12px;text-align:left}
.srow .addb{margin-right:12px}
.addb.on{background:var(--acc);color:var(--onacc)}
b.hit{color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
.fhead{display:flex;gap:12px;align-items:center;margin:2px 0 12px}
.ic.big{width:56px;height:56px;font-size:32px;border-radius:16px}
.nbig .pct{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:2px}
.nbig > div:first-child b{margin-top:15px}
.amtbox{background:var(--card);border-radius:16px;padding:12px;margin-bottom:14px}
.amtrow{display:flex;align-items:center;gap:10px}
.amtrow input{font-size:24px;font-weight:800;padding:10px 12px;flex:1}
.unitlab{color:var(--ink2);font-weight:700;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:700;color:var(--ink2)}
.chips button.on{background:var(--ink);color:var(--bg)}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.ring{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.ring svg{width:52px;height:52px}
.ring b{position:absolute;top:16px;left:0;right:0;font-size:12px}
.ring span{font-size:12px;color:var(--ink2);font-weight:600}
.scgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.sc span{width:60px;height:60px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ink)}
.sc:active span{background:var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheets"></div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const todayStr = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const mins = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const mondayOf = s => { const d = parseYmd(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return ymd(d); };
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const fmt = n => r0(n).toLocaleString('en-AU');
const hourLabel = h => (h % 12 || 12) + (h < 12 || h === 24 ? ' AM' : ' PM');
const timeLabel = hm => { const [h, m] = hm.split(':').map(Number); return (h % 12 || 12) + ':' + pad(m) + (h < 12 ? ' am' : ' pm'); };
const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayName = s => { const t = todayStr(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; if (s === addDays(t, 1)) return 'Tomorrow'; const d = parseYmd(s); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };

const ICON = {
  cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  dots:'<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  search:'<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
  barcode:'<path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M16 8v8"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  right:'<path d="M9 5l7 7-7 7"/>',
  dash:'<rect x="4" y="4" width="7" height="9" rx="2"/><rect x="13" y="4" width="7" height="5" rx="2"/><rect x="13" y="11" width="7" height="9" rx="2"/><rect x="4" y="15" width="7" height="5" rx="2"/>',
  log:'<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  strat:'<circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M10.5 8 7.5 15M13.5 8l3 7"/>',
  more:'<circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="3"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  scale:'<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 9a6 6 0 0 1 8 0l-2 3h-4z"/>',
  sync:'<path d="M20 12a8 8 0 0 1-14 5.3M4 12A8 8 0 0 1 18 6.7"/><path d="M18 3v4h-4M6 21v-4h4"/>',

  MICROS.forEach(([m]) => { if (p[m] != null) o[m] = p[m] * k; });
  if (p.extra) { o.extra = {}; for (const key in p.extra) o.extra[key] = p.extra[key] * k; }
  return o;
}

  const o = {kcal: 0, p: 0, f: 0, c: 0, fibre: 0, sugar: 0, satfat: 0, sodium: 0};

function suggestions(date, centerMin, limit = 8, windowMin = 75) {
  const scores = {};
  const already = new Set(dayEntries(date).map(e => e.foodId || e.name));
  S.entries.forEach(e => {
    if (e.date === date) return;
    const ago = daysBetween(e.date, date); if (ago < 0 || ago > 42) return;
    const diff = Math.abs(mins(e.time) - centerMin); if (diff > windowMin) return;
    const key = e.foodId || ('q:' + e.name);
    if (already.has(e.foodId || e.name)) return;
    const w = (1 + (42 - ago) / 42) * (1 - diff / (windowMin * 2));
    const s = scores[key] || (scores[key] = {key, score: 0, count: 0, times: [], last: null});
    s.score += w; s.count++; s.times.push(mins(e.time));
    if (!s.last || e.date > s.last.date) s.last = e;
  });
  return Object.values(scores).sort((a, b) => b.score - a.score).slice(0, limit).map(s => {
    s.times.sort((a, b) => a - b); const med = s.times[Math.floor(s.times.length / 2)];
    s.typical = pad(Math.floor(med / 60)) + ':' + pad(med % 60); return s;
  });
}

/* ---------- weight + trend ---------- */
function trendSeries() {
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  if (!ws.length) return [];
  const map = {}; ws.forEach(w => map[w.date] = w.kg);
  const out = []; let t = ws[0].kg; const end = todayStr() > ws[ws.length - 1].date ? todayStr() : ws[ws.length - 1].date;
  for (let d = ws[0].date; d <= end; d = addDays(d, 1)) {
    if (map[d] != null) t = t + 0.1 * (map[d] - t);
    out.push({date: d, kg: map[d] ?? null, trend: t});
  }
  return out;
}
function trendOn(date) { const s = trendSeries(); let v = null; s.forEach(x => { if (x.date <= date) v = x.trend; }); return v; }

function weightChart(days = 60) {
  const s = trendSeries().slice(-days);
  if (s.length < 2) return '<p class="note">Log your weight a few mornings a week and your trend line will show here.</p>';
  const W = 340, H = 170, L = 34, R = 8, T = 10, B = 22;
  const vals = s.flatMap(x => x.kg != null ? [x.kg, x.trend] : [x.trend]);
  let mn = Math.min(...vals), mx = Math.max(...vals); const padv = Math.max(0.3, (mx - mn) * 0.15); mn -= padv; mx += padv;
  const X = i => L + i / (s.length - 1) * (W - L - R), Y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const line = s.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.trend).toFixed(1)).join(' ');
  const area = line + ` L${X(s.length - 1).toFixed(1)} ${H - B} L${L} ${H - B} Z`;
  const dots = s.map((x, i) => x.kg != null ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="2.6" fill="#A3AAB3"/>` : '').join('');

/* ---------- strategy / weekly adjustment ---------- */
function computeCheckin(asOf) {
  // Uses the 14 days before asOf (asOf is a Monday).
  const start = addDays(asOf, -14), end = addDays(asOf, -1);
  let logged = 0, kc = 0;
  for (let d = start; d <= end; d = addDays(d, 1)) { const s = sum(dayEntries(d)); if (s.kcal >= 1000) { logged++; kc += s.kcal; } }
  const wIn = S.weights.filter(w => w.date >= start && w.date <= end).sort((a, b) => a.date.localeCompare(b.date));
  const tA = trendOn(start), tB = trendOn(end);
  if (logged < 8 || wIn.length < 3 || tA == null || tB == null || daysBetween(wIn[0].date, wIn[wIn.length - 1].date) < 7) {
    return {ok: false, reason: `Not enough data yet (${logged}/14 days logged, ${wIn.length} weigh-ins). Targets kept.`};
  }
  const avg = kc / logged; const days = daysBetween(start, end);
  const change = tB - tA; const measured = avg - change * 7700 / days;
  const tdee = Math.round(0.5 * S.tdee + 0.5 * measured);
  const cur = targetFor(end);
  let kcal = Math.round(tdee + S.goal.rate * 7700 / 7);
  kcal = Math.max(cur.kcal - 200, Math.min(cur.kcal + 200, kcal));
  kcal = Math.max(1500, Math.round(kcal / 5) * 5);
  const p = cur.p, f = cur.f, c = Math.max(100, Math.round((kcal - p * 4 - f * 9) / 4));
  const rate = change / days * 7;
  return {ok: true, tdee, kcal, p, f, c, note: `Avg intake ${fmt(avg)} kcal, trend ${rate >= 0 ? '+' : ''}${rate.toFixed(2)} kg/wk, expenditure ~${fmt(tdee)} kcal.`};
}
function runCheckin(force) {
  const mon = mondayOf(todayStr());
  if (!force && (!S.goal.auto || (S.lastCheckin && S.lastCheckin >= mon))) return;
  if (S.coach && S.coach.start >= addDays(mon, -6) && !force) { S.lastCheckin = mon; save(); return; }
  const r = computeCheckin(mon); S.lastCheckin = mon;
  if (r.ok) {
    S.tdee = r.tdee;
    S.targets = S.targets.filter(t => !(t.start === mon && t.source === 'auto'));
    S.targets.push({start: mon, kcal: r.kcal, p: r.p, f: r.f, c: r.c, source: 'auto', note: r.note});
    S.lastCheckinNote = null;
    toast('Weekly check-in: target ' + fmt(r.kcal) + ' kcal');
  } else S.lastCheckinNote = r.reason;
  dirty(null);
}

/* ---------- offline food database (search.js worker) ---------- */
let FW = null, fwSeq = 0;
const fwWait = {}, fwState = {ready: false, downloading: false, info: null, error: null}, fwListeners = new Set();
function foodWorker() {
  if (FW || !window.Worker) return FW;
  try {
    FW = new Worker('search.js');
    FW.onmessage = e => {
      const m = e.data;
      if (m.type === 'ready') { fwState.ready = true; fwState.downloading = false; fwState.info = m; }
      else if (m.type === 'progress') fwState.downloading = true;
      else if (m.type === 'error') { fwState.error = m.message; fwState.downloading = false; }
      else if (fwWait[m.seq]) { fwWait[m.seq](m); delete fwWait[m.seq]; return; }
      fwListeners.forEach(f => f());
    };
    FW.onerror = () => { fwState.error = 'worker'; fwListeners.forEach(f => f()); };
    FW.postMessage({type: 'load'});
  } catch (e) { FW = null; }
  return FW;
}
function fwAsk(msg) {
  return new Promise(ok => {
    const w = foodWorker(); if (!w) return ok(null);
    const seq = ++fwSeq; fwWait[seq] = ok; w.postMessage(Object.assign({seq}, msg));
    setTimeout(() => { if (fwWait[seq]) { delete fwWait[seq]; ok(null); } }, 20000);
  });
}

/* ---------- units ---------- */
// Australian metric spoons and cups. USDA portions keep their own labels and gram weights.
const MASS = [['g', 1], ['oz', 28.35], ['lb', 453.6]];
const VOL = [['ml', 1], ['tsp', 5], ['tbsp', 20], ['cup', 250], ['fl oz', 29.57]];
const US_VOL = {cup: 236.6, cups: 236.6, tbsp: 14.79, tablespoon: 14.79, tsp: 4.93, teaspoon: 4.93, 'fl oz': 29.57};
function isLiquid(f) { return !!f.liquid || (f.servings || []).some(s => /(\d|\b)\s*ml\b|\d\s*l\b|litre|liter/i.test(s.label)); }
function densityOf(f) { // grams per ml
  if (isLiquid(f)) return 1;
  for (const s of f.servings || []) {
    const m = String(s.label).toLowerCase().match(/^([\d.\/ ]+)\s*(cups?|tbsp|tablespoons?|tsp|teaspoons?|fl oz)\b/);
    if (m) { const q = parseQty(m[1]); const u = US_VOL[m[2].replace(/s$/, '')] || US_VOL[m[2]]; if (q && u) return s.g / (q * u); }
  }
  return null;
}
function parseQty(t) { t = String(t).trim(); let n = 0; for (const p of t.split(/\s+/)) { if (p.includes('/')) { const [a, b] = p.split('/').map(Number); if (b) n += a / b; } else if (!isNaN(+p)) n += +p; } return n || null; }
function unitOptions(f) {
  const liquid = isLiquid(f), dens = densityOf(f);
  const o = [];
  const metric = liquid ? VOL.map(([u, ml]) => ({key: u, label: u, g: ml * dens, metric: true})) : MASS.map(([u, g]) => ({key: u, label: u, g, metric: true}));
  o.push(...metric.slice(0, liquid ? 1 : 1));
  (f.servings || []).forEach((s, i) => { if (s.g > 0) o.push({key: 's' + i, label: s.label, g: s.g, chip: shortServing(s.label)}); });
  const has1 = u => (f.servings || []).some(s => new RegExp('^1\\s*' + u + '\\b', 'i').test(s.label));
  o.push(...metric.slice(1).filter(u => !has1(u.label)));
  if (liquid) o.push({key: 'g', label: 'g', g: 1, metric: true});
  else if (dens) VOL.filter(([u]) => !has1(u)).forEach(([u, ml]) => o.push({key: u, label: u, g: ml * dens, metric: true}));
  else o.push({key: 'ml', label: 'ml', g: 1, metric: true}); // assume about 1 g per ml
  return o;
}
function shortServing(l) { l = String(l).replace(/\s*\(.*\)\s*/, '').trim(); return l.length > 18 ? l.slice(0, 17) + '…' : l || 'serving'; }
function findUnit(units, label) { if (label === 'g / ml') label = 'g'; return units.find(u => u.label === label) || units.find(u => u.key === label); }
function amountLabel(u, amount) { return u.metric ? r1(amount) + ' ' + u.label : (amount === 1 ? u.label : r1(amount) + ' × ' + u.label); }
function defaultAmount(f) {
  const units = unitOptions(f); const lu = lastUse(f.id);
  if (lu) { const u = findUnit(units, lu.unit); if (u) return {unit: u, amt: lu.amount}; }
  const s = units.find(u => !u.metric); if (s) return {unit: s, amt: 1};
  return {unit: units[0], amt: 100};
}

/* ---------- Open Food Facts ---------- */
const OFF_FIELDS = 'code,product_name,product_name_en,brands,nutriments,serving_size,serving_quantity,categories_tags,allergens_tags,traces_tags,ingredients_analysis_tags,countries_tags';

  const extra = {};

async function offSearch(term) {

function openEntry(id) {

function logMeal(id, time) {

  const recs = m.items.map(it => Object.assign({}, it, {id: uid(), date: selDate, time}));
  S.entries.push(...recs); dirty(selDate); closeSheet(true);
  toast(`Logged ${m.name}`, () => { const ids = new Set(recs.map(r => r.id)); S.entries = S.entries.filter(x => !ids.has(x.id)); dirty(selDate); render(); });

/* ---------- barcode scanner ---------- */
let scanStream = null, scanLoop = null, zxReader = null;
async function openScanner(getTime, onAdd) {
  const time = typeof getTime === 'function' ? getTime() : defaultTime();
  const el = document.createElement('div'); el.id = 'scan';
  el.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div><div class="msg" id="smsg">Point the camera at a barcode</div>
    <div class="bar2"><input id="manual" inputmode="numeric" placeholder="Or type the barcode" style="background:#1D2024"><button class="btn" id="mgo" style="flex:none;width:80px">Find</button><button class="btn sec" id="sclose" style="flex:none;width:80px">Close</button></div>`;
  document.body.appendChild(el);
  const video = $('video', el), msg = $('#smsg', el);
  const stop = () => { if (scanLoop) cancelAnimationFrame(scanLoop); scanLoop = null; if (zxReader) { try { zxReader.reset(); } catch (e) {} zxReader = null; } if (scanStream) scanStream.getTracks().forEach(t => t.stop()); scanStream = null; el.remove(); };
  let done = false;
  const found = async code => {
    if (done) return; done = true; if (navigator.vibrate) navigator.vibrate(40);
    stop(); await handleBarcode(String(code).trim(), time, onAdd);
  };
  $('#sclose', el).onclick = stop;
  $('#mgo', el).onclick = () => { const c = $('#manual', el).value.replace(/\D/g, ''); if (c.length >= 6) found(c); else toast('Enter the full barcode'); };
  try {
    if ('BarcodeDetector' in window) {
      const fmts = await BarcodeDetector.getSupportedFormats();
      const det = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(f => fmts.includes(f))});
      scanStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 1280}}});
      video.srcObject = scanStream; await video.play();
      const tick = async () => { if (done || !scanStream) return; try { const r = await det.detect(video); if (r[0]) return found(r[0].rawValue); } catch (e) {} scanLoop = requestAnimationFrame(tick); };
      tick();
    } else {
      msg.textContent = 'Starting camera…';
      await loadScript('https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js');
      const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
      zxReader = new ZXing.BrowserMultiFormatReader(hints, 300);
      await zxReader.decodeFromConstraints({video: {facingMode: 'environment'}}, video, (res) => { if (res) found(res.getText()); });
      msg.textContent = 'Point the camera at a barcode';
    }
  } catch (e) {
    msg.textContent = 'Camera unavailable. Type the barcode below instead.';
  }
}
function loadScript(src) { return new Promise((ok, bad) => { if ([...document.scripts].some(s => s.src === src)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function handleBarcode(code, time, onAdd) {
  const ctx = {time, onAdd};
  const local = Object.values(S.foods).find(f => f.barcode === code);
  if (local) return openFood(local, ctx);
  if (fwState.ready) { const r = await fwAsk({type: 'barcode', code}); if (r && r.food) return openFood(r.food, ctx); }
  if (!navigator.onLine) { toast('Offline, and this barcode isn\'t saved yet'); return editFood(null, code, f => openFood(f, {time})); }
  toast('Looking up ' + code + '…');
  try {
    const f = await offBarcode(code);
    if (f) { if (f.incomplete) return editFood(f, code, nf => openFood(nf, ctx)); return openFood(f, ctx); }
  } catch (e) {}
  toast('Not found. Add it from the label.');
  editFood(null, code, f => openFood(f, ctx));
}

  const tr = {}; trendSeries().forEach(x => tr[x.date] = x.trend);
  return dates.map(d => { const s = sum(dayEntries(d)); const t = targetFor(d); const w = S.weights.find(x => x.date === d);
    return [d, r0(s.kcal), r0(s.p), r0(s.f), r0(s.c), r0(s.fibre), r0(s.sodium), t.kcal, t.p, t.f, t.c, w ? w.kg : '', tr[d] != null ? r1(tr[d] * 10) / 10 : '']; });
}
async function flushSync(final) {
  const url = S.settings.syncUrl; if (!url || syncing || !navigator.onLine) return;
  if (!S.syncDates.length && !S.syncMeta) return;
  syncing = true;
  const dates = [...S.syncDates];
  const payload = {app: 'fuel', days: dates.map(d => ({date: d, rows: dayEntries(d).map(entryRow)}))};
  if (S.syncMeta) {
    payload.daily = dailyRows();
    payload.weight = [...S.weights].sort((a, b) => a.date.localeCompare(b.date)).map(w => [w.date, w.kg, r1((trendOn(w.date) || w.kg) * 10) / 10, w.bf != null ? w.bf : '']);
    payload.targets = [...S.targets].sort((a, b) => a.start.localeCompare(b.start)).map(t => [t.start, t.kcal, t.p, t.f, t.c, t.source, t.note || '']);
    payload.foods = Object.values(S.foods).filter(f => f.source !== 'builtin').map(f => [f.id, f.name, f.brand || '', f.barcode || '', f.servings[0] ? f.servings[0].label : '', f.servings[0] ? f.servings[0].g : '', r0(f.per100.kcal), r1(f.per100.p), r1(f.per100.f), r1(f.per100.c)]);
    payload.settings = [['goal_rate_kg_per_week', S.goal.rate], ['auto_adjust', S.goal.auto], ['expenditure_estimate', S.tdee]];
  }
  try {
    await fetch(url, {method: 'POST', mode: 'no-cors', keepalive: !!final, headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    S.syncDates = S.syncDates.filter(d => !dates.includes(d)); S.syncMeta = false; S.lastSync = Date.now(); save();
  } catch (e) {} finally { syncing = false; }
}
async function pullCoach() {
  const url = S.settings.syncUrl; if (!url || !navigator.onLine) return;
  try {
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'coach=1'); if (!r.ok) return;
    const j = await r.json(); if (!j) return;
    importInbox(j.inbox);
    const c = j.coach; if (!c || !c.start || !c.kcal) return;
    const key = c.start + '|' + c.kcal + '|' + c.p + '|' + c.f + '|' + c.c;
    if (S.coach && S.coach.key === key) return;
    S.coach = {key, start: c.start};
    S.targets = S.targets.filter(t => !(t.start === c.start && t.source === 'coach'));
    S.targets.push({start: c.start, kcal: +c.kcal, p: +c.p, f: +c.f, c: +c.c, source: 'coach', note: c.note || ''});
    dirty(null); render(); toast('New targets from Claude');
  } catch (e) {}
}
// Rows Claude adds to the Sheet's Inbox tab become entries here (each row once, matched by its id).
function importInbox(rows) {
  if (!Array.isArray(rows) || !rows.length) return;
  S.inboxDone = S.inboxDone || [];
  const added = [];
  rows.forEach(x => {
    const id = 'in-' + String(x.id || '').trim();
    if (id === 'in-' || S.inboxDone.includes(id) || S.entries.some(e => e.id === id)) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(x.date) || !(+x.kcal >= 0)) return;
    const time = /^\d{1,2}:\d{2}/.test(x.time) ? x.time.padStart(5, '0').slice(0, 5) : '12:00';
    const name = String(x.name || 'Added by Claude').slice(0, 80);
    const rec = {id, date: x.date, time, foodId: null, name, brand: '', emoji: x.emoji || emojiFor(name), amount: 1, unit: '', label: String(x.label || ''), grams: 0,
      kcal: +x.kcal, p: +x.p || 0, f: +x.f || 0, c: +x.c || 0};
    if (x.fibre !== '' && x.fibre != null) rec.fibre = +x.fibre;
    if (x.sodium !== '' && x.sodium != null) rec.sodium = +x.sodium;
    S.entries.push(rec); S.inboxDone.push(id); added.push(rec);
  });
  if (!added.length) return;
  [...new Set(added.map(e => e.date))].forEach(d => dirty(d));
  if (!stack.length) render();
  toast(added.length === 1 ? `Claude logged ${added[0].name}` : `Claude logged ${added.length} foods`);
}
function syncSettings() {
  sheet('Google Sheet sync', `<p class="note" style="margin-top:0">Every entry, weigh-in and target change is sent to your Fuel Google Sheet, so Claude can read it for check-ins. Claude can also set targets in the Sheet's Coach tab, which the app picks up when it opens.</p>
    <div class="field"><label for="su">Sync address</label><input id="su" value="${esc(S.settings.syncUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <p class="note">${S.lastSync ? 'Last sent ' + new Date(S.lastSync).toLocaleString('en-AU') + '.' : 'Nothing sent yet.'} ${S.syncDates.length} day(s) waiting.</p>`,
    `<button class="btn sec" id="all">Send everything</button><button class="btn" id="ok">Save</button>`, el => {
      const set = () => { const u = $('#su', el).value.trim(); if (u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { toast('That isn\'t an Apps Script address'); return false; } S.settings.syncUrl = u; return true; };
      $('#all', el).onclick = () => { if (!set()) return; S.syncDates = [...new Set(S.entries.map(e => e.date))]; dirty(null); flushSync(); pullCoach(); toast('Sending'); closeSheet(); };
      $('#ok', el).onclick = () => { const was = S.settings.syncUrl; if (!set()) return; if (S.settings.syncUrl && S.settings.syncUrl !== was) S.syncDates = [...new Set(S.entries.map(e => e.date))]; dirty(null); flushSync(); pullCoach(); closeSheet(); };
    });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSync(true); else { pullCoach(); runCheckin(); if (!stack.length) render(); } });
window.addEventListener('online', () => flushSync());

/* ---------- backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fuel-backup-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importData() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
  i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (!d || !Array.isArray(d.entries)) throw 0; S = Object.assign(DEFAULT(), d); S.syncMeta = true; save(); toast('Backup restored'); render(); } catch (e) { toast('That file isn\'t a Fuel backup'); } };
  i.click();
}
function eraseAll() {
  sheet('Erase all data', `<p>This removes every entry, food, meal, weigh-in and target from this phone. Your Google Sheet is not touched.</p><p class="note">Back up first if you might want it later.</p>`, `<button class="btn sec" data-close2>Cancel</button><button class="btn" style="background:var(--bad)" id="go">Erase</button>`, el => {
    $('[data-close2]', el).onclick = () => closeSheet();
    $('#go', el).onclick = () => { localStorage.removeItem(KEY); location.reload(); };
  });
}

/* ================= start ================= */
(function init() {
  const m = location.hash.match(/sync=([^&]+)/);
  if (m) { try { S.settings.syncUrl = decodeURIComponent(m[1]); S.syncDates = [...new Set(S.entries.map(e => e.date))]; S.syncMeta = true; save(); history.replaceState(null, '', location.pathname); setTimeout(() => toast('Google Sheet sync connected'), 600); } catch (e) {} }
  runCheckin();
  render(); scrollToNow();
  pullCoach(); flushSync();
  // re-render each minute so the now line and suggestions move along
  setInterval(() => { if (!stack.length && view === 'log' && document.visibilityState === 'visible') { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 60000);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(foodWorker, 1500); // start downloading / loading the food database in the background
})();
</script>
