<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nine Sets</title>
<meta name="description" content="Private nSuns 5/3/1 workout logger">
<meta name="theme-color" content="#303f9f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nine Sets">
<style>
:root{
  --primary:#3f51b5; --primaryDark:#303f9f; --accent:#ff4081;
  --bg:#d3d3d3; --card:#ffffff; --ghost:#f8f8ff; --floral:#fffaf0;
  --text:#000000; --muted:#737373; --line:#d3d3d3;
  --slate:#6a5acd; --slategray:#708090; --cadet:#5f9ea0; --seagreen:#8fbc8f;
  --green:#008000; --red:#ff0000; --doneTint:#cbfdcb;
  --input:#ffffff;
}
:root[data-theme="dark"]{
  --primary:#303f9f; --primaryDark:#1a237e; --accent:#ff4081;
  --bg:#121212; --card:#1f1f1f; --ghost:#252530; --floral:#26241f;
  --text:#ececec; --muted:#a0a0a0; --line:#3a3a3a;
  --slate:#9d90f0; --slategray:#9aa8b5; --cadet:#4c8587; --seagreen:#5e8a5e;
  --green:#4caf50; --red:#ff5252; --doneTint:#2e4a2e;
  --input:#2a2a2a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior-y:none}
body{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text);background:var(--input);border:0;border-bottom:1px solid var(--muted);padding:6px 2px;border-radius:0;min-width:0}
input:focus,select:focus{outline:none;border-bottom:2px solid var(--accent)}
select{border:1px solid var(--line);border-radius:2px;padding:8px}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.hidden{display:none!important}
.statusfill{background:var(--primaryDark);height:env(safe-area-inset-top)}
.tabbar{position:sticky;top:0;z-index:5;background:var(--primary);display:flex;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tabbar button{flex:1;height:52px;display:grid;place-items:center;color:#fff}
.tabbar svg.i{width:26px;height:26px}
.toolbar{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;display:flex;align-items:center;height:56px;padding:0 4px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.toolbar h1{font-size:20px;font-weight:500;margin:0 0 0 12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.toolbar .clock{font-size:20px;font-variant-numeric:tabular-nums;padding:0 6px;min-width:64px;text-align:center}
.toolbar .clock.run{color:#ffff8d}
.toolbar .clock.over{color:#b9f6ca}
main{max-width:640px;margin:0 auto;padding:2px 4px 8px}
.card{background:var(--card);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);margin:6px 4px;overflow:hidden}
.ctitle{text-align:center;font-weight:700;color:var(--muted);font-size:14px;padding:8px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:0;padding:0 2px 4px}
.tile{background:var(--card);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);margin:4px;height:96px;display:flex;flex-direction:column;overflow:hidden;text-align:center}
.tile .h{background:var(--cadet);font-weight:700;font-size:14px;min-height:38px;display:grid;place-items:center;padding:0 2px;color:#000;line-height:1.1}
.tile .v{flex:1;display:grid;place-items:center;font-size:28px;color:var(--text)}
.day{display:flex;align-items:center;margin:6px 6px;padding:8px 4px 8px 12px;min-height:72px}
.day .txt{flex:1;min-width:0}
.day .t{color:var(--text);font-size:16px}
.day .l{color:var(--muted);font-size:14px}
.cb{width:36px;height:36px;display:grid;place-items:center;flex:none}
.cb span{width:22px;height:22px;border:2px solid var(--muted);border-radius:2px;display:grid;place-items:center}
.cb.on span{background:var(--accent);border-color:var(--accent)}
.cb.on span::after{content:'';width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.dots{width:36px;height:44px;display:grid;place-items:center;color:var(--muted)}
.weekbtn{display:block;width:calc(100% - 12px);margin:6px;background:var(--seagreen);color:#000;font-size:18px;height:56px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ex{background:var(--ghost);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.3);margin:8px 6px;padding:10px 6px 4px 12px}
.ex .hd{display:flex;align-items:center;gap:2px}
.ex .hd .nm{flex:1;font-size:18px;font-weight:700;color:var(--text)}
.ex .hd .sub{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.ex .ic{width:40px;height:40px;display:grid;place-items:center;color:var(--slate)}
.ex .ic.off{color:var(--slategray);opacity:.55}
.expand{display:flex;align-items:center;width:100%;color:var(--slate);font-weight:700;font-size:16px;padding:6px 0 4px;text-align:left}
.expand span{flex:1}
.setrow{position:relative;display:flex;align-items:center;background:var(--card);margin:4px 2px 6px -4px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.25);min-height:56px;padding:0 4px 0 8px}
.setrow .lhs{flex:1;display:flex;align-items:center;gap:2px;min-width:0}
.setrow .am{width:15px;height:15px;color:var(--accent);margin-right:2px}
.setrow input{width:3.2em;text-align:center;font-size:18px;background:transparent}
.setrow input.wt{width:4.2em}
.setrow .x{font-size:18px;color:var(--text);white-space:pre}
.setrow .u{font-size:14px;color:var(--muted);margin-left:2px}
.setrow .act{width:46px;height:52px;display:grid;place-items:center}
.setrow .act svg.i{width:34px;height:34px}
.setrow .del{color:var(--slategray)}
.setrow .ok{color:var(--green)}
.setrow .tint{position:absolute;inset:0;background:var(--doneTint);display:flex;justify-content:flex-end;align-items:center;padding-right:4px;border-radius:2px}
.setrow .tint .redo{color:var(--red);width:46px;height:52px;display:grid;place-items:center}
.setrow .tint .redo svg.i{width:34px;height:34px}
.setrow .tint .sum{flex:1;padding-left:27px;font-size:18px;color:var(--text)}
.setwrap{margin-bottom:2px}
.pctl{font-size:12px;color:var(--muted);margin:0 0 0 22px}
.sect{font-size:16px;color:var(--muted);padding:12px 16px 4px}
.row{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:52px;width:100%;text-align:left;color:var(--text);border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ri{color:var(--slate)}
.row .rt{flex:1}
.row .rs{font-size:13px;color:var(--muted);display:block}
.box{background:var(--card);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);margin:6px;padding:10px 14px}
.box .t{font-size:16px;color:var(--text);font-weight:500}
.box .m{color:var(--muted);font-size:14px}
.inl{display:flex;align-items:center;gap:8px;margin-top:6px}
.inl input{width:90px;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:2px;background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3);font-size:15px}
.btn.prim{background:var(--primary);color:#fff}
.btn.full{display:flex;width:calc(100% - 12px);margin:6px}
.lnk{color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.chartcard{background:var(--card);margin:6px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);padding:8px 6px}
.chart{width:100%;height:auto;display:block}
.spin{display:block;width:calc(100% - 12px);margin:6px}
.minitabs{display:flex;background:var(--slate)}
.minitabs button{flex:1;color:#fff;opacity:.7;padding:12px 0;font-weight:500}
.minitabs button.on{opacity:1;border-bottom:3px solid #d3d3d3}
.histex{background:var(--ghost);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.3);margin:8px 6px;padding:10px}
.histex .t{font-size:18px;font-weight:700}
.histex .bar{height:2px;background:var(--slate);margin:4px 0 6px}
.histex .s{font-size:17px;padding:3px 0}
.datechips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px}
.datechips button{background:var(--card);border-radius:14px;padding:5px 11px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.datechips button.on{background:var(--primary);color:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);width:100%;max-width:420px;max-height:86vh;overflow:auto;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:20px 20px 8px}
.dlg h2{margin:0 0 12px;font-size:20px;font-weight:500}
.dlg .acts{display:flex;justify-content:flex-end;gap:4px;margin:16px -8px 0}
.dlg .acts button{color:var(--accent);font-weight:700;padding:10px 12px;text-transform:uppercase;font-size:14px}
.dlg .opt{display:flex;align-items:center;gap:14px;padding:12px 2px;width:100%;text-align:left;font-size:16px}
.dlg label.f{display:block;font-size:13px;color:var(--muted);margin-top:12px}
.dlg input,.dlg select{width:100%}
.dlg .grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.platecols{display:flex;overflow-x:auto;background:var(--card);margin-top:8px}
.platecols div{flex:1;min-width:46px;text-align:center;padding:4px 2px}
.platecols b{display:block;color:var(--slate);font-size:20px;font-weight:400}
.platecols span{font-size:17px}
.stepper{display:flex;align-items:stretch;gap:0;margin:4px 0}
.stepper button{width:48px;background:var(--bg);font-weight:700;font-size:20px}
.stepper input{text-align:center;flex:1;border:0;background:var(--input);font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 28px);background:#323232;color:#fff;padding:12px 18px;border-radius:2px;z-index:30;font-size:14px;max-width:90vw;box-shadow:0 3px 8px rgba(0,0,0,.4)}
</style>
</head>

      {main:[a3('pullup',5,'5'),t2('cgbench','bench','plan3x8')],acc:[a('sacrow',3,'10'),a('latraise',3,'12-15'),a('facepull',3,'15'),a('legext',2,'12'),a('calf',3,'12')]},
      {main:[t1('hack','plan6'),a3('trapbar',3,'5')],acc:[a('hamcurl',3,'10'),a('bss',2,'8'),a('crunch',3,'12')]},

}

/* ================= State ================= */
const KEY = 'ninesets-v2';
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function defaults(){
  const ex = {}; for (const k in EXLIB) ex[k] = clone(EXLIB[k]);
  return {
    v:2, setup:false, variant:'plan3', pendingVariant:null, variants:variantTemplates(), week:1, weekDone:[], workouts:{},
    ex, tm:{}, customTms:[], tmLog:[], history:[], bw:[], deload:false,
    settings:{round:2.5, bar:20, plates:{'25':1,'20':1,'15':1,'10':1,'7.5':0,'5':1,'2.5':1,'1.25':1,'0.5':0},
      autoTimer:true, restSecs:120, sound:true, volume:10, vibrate:true, interval:false, intervalSecs:30, notify:false, wake:true,
      prog:[0,2.5,2.5,5,5,5,7.5,7.5], theme:'light'},
    timer:null,
  };
}
let S;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); const x = Object.assign(defaults(), d); x.settings = Object.assign(defaults().settings, d.settings||{}); return x; } } catch(e) {}
  return defaults();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast('Could not save. Storage full?'); } }
S = load();

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { if (n === '' || n == null || isNaN(n)) return ''; const r = Math.round(n*100)/100; return String(r); };
const fmt1 = n => (n == null || isNaN(n)) ? '–' : (+n).toFixed(1);
const rnd = w => { const r = S.settings.round || 2.5; return Math.round(w / r) * r; };
const exName = id => (S.ex[id] && S.ex[id].name) || id;
const tileName = k => ({bench:'Bench',squat:'Squat',deadlift:'Deadlift',ohp:'OHP'})[k] || exName(k);
const e1rm = (w, r) => r > 0 ? (r === 1 ? w : w * (1 + r / 30)) : 0;
const todayIso = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const longDate = iso => new Date(iso.length === 10 ? iso + 'T12:00' : iso).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'});
const shortDate = iso => new Date(iso.length === 10 ? iso + 'T12:00' : iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const mmss = s => { const neg = s < 0; s = Math.abs(Math.round(s)); return (neg?'-':'') + String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const V = () => S.variants[S.variant];
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
function barFor(exId){ const e = S.ex[exId]; if (!e || e.bw) return null; if (e.bar == null) return null; return e.bar; }
function platesFor(total, bar){
  let side = (total - bar) / 2; if (side < 0) return null;
  const list = Object.keys(S.settings.plates).filter(p => S.settings.plates[p]).map(Number).sort((x,y)=>y-x);
  const out = {}; for (const p of list){ while (side >= p - 1e-9){ out[p] = (out[p]||0)+1; side -= p; } }
  return {out, left: side};
}
function plateString(total, exId){
  const bar = barFor(exId); if (bar == null || !total) return '';
  const r = platesFor(total, bar); if (!r) return '';
  const parts = Object.entries(r.out).sort((x,y)=>y[0]-x[0]).map(([p,n]) => `(${n} x ${fmt(+p)})`);
  return (bar ? 'Bar ' + fmt(bar) + ': ' : 'Per side: ') + (parts.join(' ') || 'empty') + (r.left > 0.01 ? ' +' + fmt(r.left) : '');
}
function suggestionFor(reps){ if (!reps || reps < 1) return 0; return S.settings.prog[Math.min(8, reps) - 1]; }
function setTM(key, val, why){
  val = Math.max(0, +val || 0); if (S.tm[key] === val) return;
  S.tm[key] = val; S.tmLog.push({date:new Date().toISOString(), key, tm:val, why:why||'edit'});
}
function variantTmKeys(vId){
  const keys = new Set(); for (const d of S.variants[vId || S.variant].days) for (const m of d.main) if (m.tier !== 3) keys.add(m.tm);
  return [...keys].sort((x,y) => (TM_ORDER.indexOf(x)+1||99) - (TM_ORDER.indexOf(y)+1||99));
}
function lastSetsFor(exId){
  for (let i = S.history.length - 1; i >= 0; i--){ const e = S.history[i].entries.find(e => e.ex === exId && e.sets.some(s=>s.done)); if (e) return e.sets.filter(s=>s.done); }
  return null;
}
function bottomOfRange(r){ const m = String(r).match(/^\s*(\d+)/); return m ? +m[1] : ''; }

/* ================= Workouts ================= */
function buildWorkout(dayIdx){
  const day = V().days[dayIdx]; const f = S.deload ? 0.6 : 1;
  const entries = [];
  day.main.forEach(m => {
    if (m.tier === 3) { entries.push(accEntry(m.ex, m.sets, m.reps, 3)); return; }
    entries.push({tier:m.tier, ex:m.ex, tm:m.tm, timer:true, expanded:false,
      sets: SCHEMES[m.scheme].map(([p, r, am, dr]) => ({pct:p, w:rnd((S.tm[m.tm]||0)*p*f), target:r, amrap:!!am, drive:!!dr && m.tier===1 && !day.noDrive, reps:'', done:false}))});
  });
  day.acc.forEach(ac => entries.push(accEntry(ac.ex, ac.sets, ac.reps, 4)));
  return {variant:S.variant, dayIdx, week:S.week, deload:S.deload, started:new Date().toISOString(), entries, id:'w'+Date.now().toString(36)};
}
function accEntry(ex, n, range, tier){
  const last = lastSetsFor(ex); const sets = [];
  for (let i = 0; i < n; i++){ const ls = last && (last[i] || last[last.length-1]); sets.push({w: ls ? ls.w : '', target: ls ? ls.reps : bottomOfRange(range), reps:'', amrap:false, done:false}); }
  return {tier, ex, range, timer:true, expanded:false, sets};
}
function getWorkout(dayIdx){ let w = S.workouts[dayIdx]; if (!w || w.variant !== S.variant){ w = S.workouts[dayIdx] = buildWorkout(dayIdx); save(); } return w; }
function syncHistory(w){
  const done = w.entries.some(e => e.sets.some(s => s.done));
  const idx = S.history.findIndex(h => h.id === w.id);
  if (!done){ if (idx >= 0) S.history.splice(idx, 1); return; }
  const h = clone(w); h.dayName = 'Day ' + (w.dayIdx+1);
  h.entries.forEach(e => { e.sets = e.sets.filter(s => s.done).map(s => ({w:+s.w||0, reps:+s.reps||0, target:s.target, amrap:s.amrap, drive:s.drive, done:true})); });
  h.entries = h.entries.filter(e => e.sets.length);
  if (idx >= 0) { h.date = S.history[idx].date; S.history[idx] = h; } else { h.date = todayIso(); S.history.push(h); }
}
function checkComplete(w){
  const all = w.entries.length && w.entries.every(e => e.sets.every(s => s.done));
  const was = S.weekDone.includes(w.dayIdx);
  if (all && !was){ S.weekDone.push(w.dayIdx); toast('Workout Finished'); stopTimer(); }
  return all;
}

/* ================= Timer ================= */
let audioCtx = null, wakeLock = null, timerFired = false, lastInterval = 0;
function unlockAudio(){ try { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }
function beep(n, hz){
  if (!S.settings.sound || !audioCtx) return;
  const vol = Math.max(0.02, Math.min(1, (S.settings.volume||10)/15)) * .5;
  try { const t0 = audioCtx.currentTime;
    for (let i = 0; i < (n||3); i++){ const d = i*.28, o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = hz || (i===(n||3)-1 ? 1175 : 880); g.gain.setValueAtTime(.0001,t0+d); g.gain.exponentialRampToValueAtTime(vol,t0+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+d+.22); o.connect(g).connect(audioCtx.destination); o.start(t0+d); o.stop(t0+d+.24); }
  } catch(e){}
}
async function swReg(){ try { return await navigator.serviceWorker?.ready; } catch(e){ return null; } }
async function notify(title, body, actions, tag){
  if (!S.settings.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const reg = await swReg(); if (!reg) return;
  try { await reg.showNotification(title, {body, tag:tag||'workout', renotify:true, icon:'icon-192.png', badge:'icon-192.png', vibrate:S.settings.vibrate?[300,150,300]:[], actions:actions||[], data:{day:curDay()}}); } catch(e){}
}
async function clearNotif(){ const reg = await swReg(); try { (await reg.getNotifications()).forEach(n=>n.close()); } catch(e){} }
function startTimer(secs){ S.timer = {end: Date.now() + secs*1000, total: secs}; timerFired = false; lastInterval = Date.now(); save(); renderClock(); }
function stopTimer(){ S.timer = null; save(); renderClock(); }
function timerLeft(){ return S.timer ? (S.timer.end - Date.now())/1000 : 0; }
function renderClock(){
  const el = $('#clock'); const left = timerLeft();
  if (el){ el.textContent = S.timer ? mmss(Math.max(0,left)) : '00:00'; el.classList.toggle('run', !!S.timer && left > 0); el.classList.toggle('over', !!S.timer && left <= 0); }
  if (!S.timer) return;
  if (S.settings.interval && left > 0 && Date.now() - lastInterval >= S.settings.intervalSecs*1000){ lastInterval = Date.now(); beep(1, 660); }
  if (left <= 0 && !timerFired){
    timerFired = true; beep(3);
    if (S.settings.vibrate && navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
    if (document.hidden) notifyNextSet('Rest finished');
  }
  if (left < -60) stopTimer();
}
setInterval(renderClock, 250);
async function requestWake(){
  if (!S.settings.wake || !('wakeLock' in navigator) || document.hidden) return;
  try { if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch(e){}
}
function curDay(){ const p = nav[nav.length-1]; return p && p.page === 'workout' ? p.arg : null; }
function nextSet(w){ for (let ei = 0; ei < w.entries.length; ei++){ const e = w.entries[ei]; for (let si = 0; si < e.sets.length; si++) if (!e.sets[si].done) return {e, s:e.sets[si], ei, si}; } return null; }
function notifyNextSet(prefix){
  const d = curDay(); if (d == null) return; const w = S.workouts[d]; if (!w) return;
  const n = nextSet(w);
  if (!n){ notify('Workout Finished', 'Remember to input your AMRAP sets!', [], 'workout'); return; }
  const reps = n.s.amrap ? n.s.target + '+' : (n.s.reps || n.s.target);
  const line = `${reps}  x  ${fmt(n.s.w)} kg`;
  const plates = plateString(+n.s.w, n.e.ex);
  if (n.s.amrap) notify((prefix ? prefix + ' · ' : '') + exName(n.e.ex), line + '\nAMRAP set - Open workout to log reps' + (plates ? '\n' + plates : ''), [{action:'open',title:'Open Workout'}]);
  else notify((prefix ? prefix + ' · ' : '') + exName(n.e.ex), line + (plates ? '\n' + plates : ''), [{action:'complete',title:'Set Complete'},{action:'open',title:'Open Workout'}]);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (curDay() != null) notifyNextSet(); } else { clearNotif(); renderClock(); requestWake(); } });
navigator.serviceWorker?.addEventListener('message', ev => {
  const d = ev.data || {}; if (d.type !== 'notif' && d.type !== 'timer') return;
  if (d.action === 'complete'){ const day = curDay(); if (day == null) return; const w = S.workouts[day]; const n = w && nextSet(w); if (n && !n.s.amrap){ completeSet(w, n.ei, n.si, true); notifyNextSet('Set logged'); } }
});

/* ================= Navigation ================= */
let nav = [{page:'home'}];
function go(page, arg){ nav.push({page, arg}); try { history.pushState({d:nav.length}, ''); } catch(e){} render(); window.scrollTo(0,0); }
function back(){ if (nav.length > 1) { try { history.back(); } catch(e){ nav.pop(); render(); } } }
window.addEventListener('popstate', () => { if ($('.scrim')) { closeDlg(); try { history.pushState({d:nav.length}, ''); } catch(e){} return; } if (nav.length > 1) { nav.pop(); render(); window.scrollTo(0,0); } });

function toolbar(title, extra){ return `<div class="toolbar"><button class="ib" data-a="back" aria-label="Back">${icon('back')}</button><h1>${esc(title)}</h1>${extra||''}</div>`; }
function render(){
  document.documentElement.dataset.theme = S.settings.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.settings.theme;
  if (!S.setup) return renderSetup();
  const p = nav[nav.length-1];
  (PAGES[p.page] || PAGES.home)(p.arg);
  renderClock();
}
const PAGES = {};

/* ---------- Setup ---------- */
function renderSetup(){
  const vs = variantTemplates(); const sel = S._sv || S.variant;
  const keys = (()=>{ const k = new Set(); for (const d of vs[sel].days) for (const m of d.main) if (m.tier !== 3) k.add(m.tm); return [...k].sort((x,y) => (TM_ORDER.indexOf(x)+1||99) - (TM_ORDER.indexOf(y)+1||99)); })();
  const guess = {bench:70, hack:80, squat:85, deadlift:100, ohp:40};
  $('#bar').innerHTML = `<div class="toolbar"><h1>Enter Training Maxes</h1></div>`;
  $('#view').innerHTML = `
    <div class="box" style="background:var(--floral)"><div class="t">Program</div>
      <select id="sv" style="width:100%;margin-top:6px">${Object.entries(vs).map(([k,v]) => `<option value="${k}" ${k===sel?'selected':''}>${esc(v.name)}</option>`).join('')}</select>
      <div class="m" style="margin-top:6px">${vs[sel].days.map((d,i)=>`Day ${i+1}: ${d.main.map(m=>esc(exName(m.ex))).join(', ')}`).join('<br>')}</div></div>
    <button class="box row" style="width:calc(100% - 12px);background:var(--floral)" data-a="tmCalc">${icon('tune','ri')}<span class="rt" style="font-size:18px">Training Max Calculator</span></button>
    ${keys.map(k => `<div class="box" style="display:flex;align-items:center;gap:8px"><span style="flex:1">${esc(exName(k))}</span><input type="number" inputmode="decimal" step="2.5" id="tm_${k}" placeholder="00.00" value="${S.tm[k] ?? guess[k] ?? ''}" style="width:90px;text-align:center"><span>kg</span></div>`).join('')}
    <p class="m" style="padding:4px 12px;color:var(--muted)">A training max is about 90% of your 1 rep max. Everything is stored on this phone only.</p>
    <button class="btn prim full" data-a="finishSetup">Next</button>`;
  $('#sv').onchange = e => { collectSetup(); S._sv = e.target.value; renderSetup(); };
}
function collectSetup(){ document.querySelectorAll('[id^=tm_]').forEach(i => { if (i.value !== '') S.tm[i.id.slice(3)] = +i.value; }); }

/* ---------- Home ---------- */

  $('#bar').innerHTML = `<div class="tabbar">
    <button data-a="nav" data-p="program" aria-label="Program Options">${icon('clipboard')}</button>

      <button class="cb ${S.weekDone.includes(i)?'on':''}" data-a="toggleDay" data-d="${i}" aria-label="Completed"><span></span></button>

/* ---------- Workout ---------- */
PAGES.workout = (day) => {
  const w = getWorkout(day);
  $('#bar').innerHTML = toolbar('Day ' + (day+1) + ' Workout', `<button class="clock" id="clock" data-a="timerDlg">00:00</button><button class="ib" data-a="wkMenu" aria-label="Options">${icon('more')}</button>`);
  let h = '';
  w.entries.forEach((e, ei) => {
    const isMain = e.tier <= 2;
    const allDone = e.sets.every(s => s.done);
    const shown = e.expanded ? e.sets.map((s,i)=>i) : (()=>{ const i = e.sets.findIndex(s => !s.done); return i < 0 ? [] : [i]; })();

function completeSet(w, ei, si, fromNotif){

  }
  $('#view').innerHTML = `<select class="spin" id="pt">${['Training Maxes','Primary Exercises','Accessory Exercises'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select>
    <select class="spin" id="px">${opts.length ? opts.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${esc(exName(k))}</option>`).join('') : '<option>No data yet</option>'}</select>
    <div class="chartcard"><div style="font-weight:500;padding:4px 6px">${title}${sel?' · '+esc(exName(sel)):''}</div>${lineChart(pts, type==='Training Maxes')}</div>`;
  $('#pt').onchange = e => { S._pt = e.target.value; S._px = null; render(); };

function lineChart(pts, step){
  const W = 600, H = 300, P = {l:44, r:12, t:12, b:30};
  if (!pts.length) return '<div class="empty">Not enough data yet.</div>';
  pts = [...pts].sort((p,q)=>p.x-q.x);
  let x0 = pts[0].x, x1 = pts[pts.length-1].x; if (x1 === x0){ x0 -= 864e5*3; x1 += 864e5*3; }
  let y0 = Math.min(...pts.map(p=>p.y)), y1 = Math.max(...pts.map(p=>p.y)); const pad = Math.max(2.5, (y1-y0)*.12); y0 = Math.floor((y0-pad)/2.5)*2.5; y1 = Math.ceil((y1+pad)/2.5)*2.5;
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 5; i++){ const yv = y0 + (y1-y0)*i/5, yy = Y(yv); g += `<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end" font-size="13" fill="var(--muted)">${fmt(Math.round(yv*10)/10)}</text>`; }
  [x0, (x0+x1)/2, x1].forEach((xv,i) => g += `<text x="${X(xv)}" y="${H-8}" text-anchor="${['start','middle','end'][i]}" font-size="13" fill="var(--muted)">${new Date(xv).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text>`);
  let d = ''; pts.forEach((p,i) => { d += i ? (step ? `H${X(p.x).toFixed(1)}V${Y(p.y).toFixed(1)}` : `L${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`) : `M${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`; });
  g += `<path d="${d}" fill="none" stroke="var(--slate)" stroke-width="3"/>`;
  pts.forEach(p => g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="var(--accent)"></circle><text x="${X(p.x)}" y="${Y(p.y)-10}" text-anchor="middle" font-size="12" fill="var(--text)">${fmt(p.y)}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ================= Backup ================= */
async function shareOrDownload(name, text, type){
  const blob = new Blob([text], {type});
  try { const file = new File([blob], name, {type}); if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; } } catch(e){ if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function exportJson(){ const d = clone(S); delete d.timer; shareOrDownload('nine-sets-backup-' + todayIso() + '.json', JSON.stringify(d), 'application/json'); }
function exportCsv(){
  const rows = [['date','week','day','exercise','tier','set','reps','weight_kg','amrap']];
  for (const s of S.history) for (const e of s.entries) e.sets.forEach((x,i) => rows.push([s.date, s.week, s.dayIdx+1, exName(e.ex), e.tier<=2?'T'+e.tier:'acc', i+1, x.reps, x.w, x.amrap?1:0]));
  shareOrDownload('nine-sets-' + todayIso() + '.csv', rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v).join(',')).join('\n'), 'text/csv');
}
function importFile(e){
  const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.variants || !Array.isArray(d.history)) throw 0;
    confirmDlg('Restore Backup', 'Replace everything on this phone with this backup (' + d.history.length + ' workouts)?', () => { S = Object.assign(defaults(), d); S.settings = Object.assign(defaults().settings, d.settings||{}); save(); toast('Backup restored'); nav = [{page:'home'}]; render(); });
  } catch(err){ toast('That file isn\'t a Nine Sets backup'); } };
  r.readAsText(f); e.target.value = '';
}

  unlockAudio();

  const A = b.dataset.a, ei = +b.dataset.e, si = +b.dataset.s;

  switch (A){

    case 'back': back(); break;
    case 'nav': go(b.dataset.p); break;
    case 'openDay': go('workout', +b.dataset.d); requestWake(); break;
    case 'toggleDay': { const d = +b.dataset.d; S.weekDone = S.weekDone.includes(d) ? S.weekDone.filter(x=>x!==d) : [...S.weekDone, d]; save(); render(); break; }
    case 'dayOpts': { const d = +b.dataset.d; optionsDlg('Workout Options', [['Restart Workout', () => confirmDlg('Warning', 'Pressing Accept will restart the selected workout and any saved sets will be lost.', () => { const w = S.workouts[d]; if (w){ const i = S.history.findIndex(h=>h.id===w.id); if (i>=0) S.history.splice(i,1); } delete S.workouts[d]; S.weekDone = S.weekDone.filter(x=>x!==d); save(); render(); toast('Restarted Workout'); })]]); break; }
    case 'tmEdit': tmEditDlg(b.dataset.k); break;
    case 'tmCalc': collectSetup(); tmCalcDlg(); break;
    case 'finishSetup': {
      collectSetup(); const v = S._sv || S.variant; S.variant = v; delete S._sv;
      const keys = variantTmKeys(v); if (keys.some(k => !(S.tm[k] > 0))) { toast('Check All Values Entered'); break; }
      keys.forEach(k => S.tmLog.push({date:new Date().toISOString(), key:k, tm:S.tm[k], why:'start'}));
      S.setup = true; save(); nav = [{page:'home'}]; render(); if (navigator.storage?.persist) navigator.storage.persist(); break; }
    case 'doneSet': { const w = W(); syncInputs(); completeSet(w, ei, si); requestWake(); break; }
    case 'redoSet': { const w = W(); const s = w.entries[ei].sets[si]; s.done = false; S.weekDone = S.weekDone.filter(x => x !== w.dayIdx); syncHistory(w); save(); render(); break; }
    case 'delSet': { const w = W(); confirmDlg('Delete Set', 'The selected set will be deleted. Continue?', () => { w.entries[ei].sets.splice(si,1); if (!w.entries[ei].sets.length) w.entries.splice(ei,1); syncHistory(w); checkComplete(w); save(); render(); }); break; }
    case 'expand': { const e2 = W().entries[ei]; e2.expanded = !e2.expanded; syncInputs(); save(); render(); break; }
    case 'exTimer': { const e2 = W().entries[ei]; e2.timer = !e2.timer; save(); render(); toast(e2.timer ? 'Rest timer on' : 'Rest timer off'); break; }
    case 'exOpts': { const w = W(), e2 = w.entries[ei]; optionsDlg('Exercise Options', [
        ['Exercise History', () => go('exHistory', e2.ex)],
        ['Add Set', () => { const l = e2.sets[e2.sets.length-1] || {w:'', target:8}; e2.sets.push({...l, reps:'', done:false, drive:false, amrap:false}); e2.expanded = true; S.weekDone = S.weekDone.filter(x=>x!==w.dayIdx); save(); render(); }],
        ['Plate Calculator', () => { const n = e2.sets.find(s=>!s.done) || e2.sets[0]; plateCalcDlg(n ? +n.w : '', barFor(e2.ex) ?? S.settings.bar); }],
        ['Delete Exercise', () => confirmDlg('Delete Exercise', `All ${exName(e2.ex)} sets will be deleted from this workout. Continue?`, () => { w.entries.splice(ei,1); syncHistory(w); checkComplete(w); save(); render(); })],
      ]); break; }
    case 'wkMenu': { const w = W(); optionsDlg('Options', [['Add Exercise', () => addExerciseToWorkout(w)], ['Timer', timerDlg], ['Plate Calculator', () => plateCalcDlg('', S.settings.bar)], ['1RM Calculator', tmCalcDlg], ['Warmup Calculator', warmupDlg]]); break; }
    case 'timerDlg': timerDlg(); break;
    case 'startWeek': startWeek(); break;
    case 'wfMenu': optionsDlg('Options', [['Change Program', switchProgramDlg]]); break;
    case 'viewSets': { const k = b.dataset.k; const rows = []; Object.values(S.workouts).forEach(w => w.entries.forEach(e => { if (e.tm === k) e.sets.filter(s=>s.done).forEach(s => rows.push(`Day ${w.dayIdx+1} ${exName(e.ex)}: ${s.reps} x ${fmt(s.w)} kg`)); })); dlg(`<h2>${esc(exName(k))} sets this week</h2>${rows.map(r=>`<div style="padding:3px 0">${esc(r)}</div>`).join('') || '<div class="m">No sets logged.</div>'}<div class="acts"><button data-a="closeDlg">Dismiss</button></div>`); break; }
    case 'progAcc': dayPicker('Program Accessories', progAccDlg); break;
    case 'manageWorkouts': dayPicker('Manage Workouts', manageWorkoutsDlg); break;
    case 'manageExercises': manageExercisesDlg(); break;
    case 'switchProgram': switchProgramDlg(); break;
    case 'deload': confirmDlg('Deload Week', S.deload ? 'Turn off the deload for this week? Workouts you haven\'t started go back to full weight.' : 'Run this week at 60% of the usual weights? Workouts you\'ve already started keep their weights unless you restart them.', () => { S.deload = !S.deload; for (const k in S.workouts) if (!S.workouts[k].entries.some(e=>e.sets.some(s=>s.done))) delete S.workouts[k]; save(); render(); }); break;
    case 'viewTms': go('viewTms'); break;
    case 'bodyweight': go('bodyweight'); break;
    case 'manageReps': dayPicker('Manage Tier 1/2 Reps and Weights', manageWorkoutsDlg); break;
    case 'extraTiers': dayPicker('Manage Additional Tiers', di => { const d = V().days[di]; optionsDlg('Day ' + (di+1) + ' Tier 3/4', [...d.main.map((m,mi)=>[m, mi]).filter(([m])=>m.tier===3).map(([m,mi]) => ['Edit ' + exName(m.ex), () => editTierDlg(di, mi)]), ['+ Add Tier 3/4 Exercise', () => editTierDlg(di, null, true)]]); }); break;
    case 'customTms': customTmsDlg(); break;
    case 'progSugg': progSuggDlg(); break;
    case 'pickDate': S._hd = b.dataset.d; render(); break;
    case 'delHist': confirmDlg('Delete Workout', 'Delete this workout from your history?', () => { S.history = S.history.filter(h => h.id !== b.dataset.id); save(); render(); }); break;
    case 'bwEnter': { const kg = +$('#bwv').value; const d = $('#bwd').value || todayIso(); if (!(kg > 0)) { toast('Enter Valid Weight'); break; } const ex = S.bw.find(x=>x.date===d); if (ex) ex.kg = kg; else S.bw.push({date:d, kg}); save(); toast(ex ? 'Updated Weight' : 'Added Weight to log'); render(); break; }
    case 'bwTab': S._bwt = b.dataset.t; render(); break;
    case 'bwDel': S.bw = S.bw.filter(x => x.date !== b.dataset.d); save(); render(); break;
    case 'setTimer': settingsTimerDlg(); break;
    case 'setSound': settingsSoundDlg(); break;
    case 'setBar': settingsBarDlg(); break;
    case 'setPlates': settingsPlatesDlg(); break;
    case 'setRound': settingsRoundDlg(); break;
    case 'appFaq': go('faq', 'app'); break;
    case 'progFaq': go('faq', 'prog'); break;
    case 'exportJson': exportJson(); break;
    case 'importJson': $('#importFile').click(); break;
    case 'exportCsv': exportCsv(); break;
    case 'setTheme': optionsDlg('Theme', ['light','dark','auto'].map(t => [t[0].toUpperCase()+t.slice(1), () => { S.settings.theme = t; save(); render(); }])); break;
    case 'resetAll': confirmDlg('Erase All Data', 'Erase all workouts, training maxes and settings on this phone? Back up first if unsure.', () => { localStorage.removeItem(KEY); S = defaults(); nav = [{page:'home'}]; render(); }, 'Erase'); break;
  }
});
function syncInputs(){
  const d = curDay(); if (d == null) return; const w = S.workouts[d]; if (!w) return;
  document.querySelectorAll('[data-in]').forEach(i => { const s = w.entries[+i.dataset.e]?.sets[+i.dataset.s]; if (s && !s.done) s[i.dataset.in] = i.value === '' ? '' : +i.value; });
}
document.addEventListener('change', e => {
  const i = e.target.closest('[data-in]'); if (!i) return; const d = curDay(); if (d == null) return;
  const s = S.workouts[d].entries[+i.dataset.e].sets[+i.dataset.s]; s[i.dataset.in] = i.value === '' ? '' : +i.value; save();
});

/* ================= Boot ================= */
try { history.replaceState({d:1}, ''); } catch(e){}
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
render(); requestWake();
</script>
</body>
</html>
